<!DOCTYPE html>
<html lang="en" data-palette="#2a78d6,#eb6834">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDIV Reject Rate Trend v1.2.0</title>
<style>
  :root{
    --surface-1:#fcfcfb; --plane:#f9f9f7;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:#e6e5df;
    --a1:#184f95; --a2:#3987e5; --a3:#86b6ef;
    --b1:#a3400f; --b2:#eb6834; --b3:#f0906a;
    --sa:#2a78d6; --sb:#eb6834;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --surface-1:#1a1a19; --plane:#0d0d0d;
      --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
      --grid:#2c2c2a; --axis:#383835; --border:#2c2c2a;
      --a1:#184f95; --a2:#3987e5; --a3:#86b6ef;
      --b1:#d95926; --b2:#eb6834; --b3:#f0906a;
      --sa:#3987e5; --sb:#d95926;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--plane);color:var(--text-primary);font:14px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 64px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--text-secondary);font-size:13px;margin:0 0 24px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:12px;margin-bottom:28px}
  .tile{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .tile .k{font-size:12px;color:var(--text-secondary);margin-bottom:6px}
  .tile .v{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
  .tile .n{font-size:12px;color:var(--text-muted);margin-top:4px}
  .card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;
        padding:18px 18px 10px;margin-bottom:20px;position:relative}
  .card h2{font-size:15px;margin:0 0 2px;font-weight:640}
  .card .cap{font-size:12px;color:var(--text-secondary);margin:0 0 10px}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin:0 0 6px;font-size:12px;color:var(--text-secondary)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .swatch{width:14px;height:3px;border-radius:2px;display:inline-block}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .08s;
       background:var(--surface-1);border:1px solid var(--axis);border-radius:8px;
       padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.14);z-index:5;white-space:nowrap}
  .tip b{display:block;margin-bottom:4px;color:var(--text-primary);font-weight:640}
  .tip i{font-style:normal;color:var(--text-secondary)}
  .tip .row{display:flex;align-items:center;gap:6px}
  .tip .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  details{margin-top:24px}
  summary{cursor:pointer;font-size:13px;color:var(--text-secondary);padding:6px 0}
  table{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px}
  th,td{border:1px solid var(--border);padding:5px 8px;text-align:center;white-space:nowrap}
  th{background:var(--plane);color:var(--text-secondary);font-weight:600}
  .scroll{overflow-x:auto}
  footer{color:var(--text-muted);font-size:12px;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
  <div class="tiles" id="tiles"></div>
  <div id="charts"></div>
  <details>
    <summary id="tglr"></summary>
    <div class="scroll"><table id="tbl"></table></div>
  </details>
  <footer id="foot"></footer>
</div>

<script>
const DATA = {"dates": ["2026.07.17", "2026.07.21", "2026.07.22", "2026.07.23", "2026.07.24", "2026.07.27", "2026.07.28", "2026.07.29", "2026.08.03", "2026.08.04", "2026.08.05", "2026.08.10", "2026.08.11", "2026.08.12", "2026.08.14", "2026.08.15", "2026.08.17", "2026.08.18", "2026.08.19", "2026.08.20", "2026.08.21", "2026.08.24", "2026.08.25", "2026.08.26", "2026.08.27", "2026.08.28", "2026.08.29", "2026.08.30", "2026.08.31", "2026.09.01", "2026.09.02"], "A": {"qty": [222, 210, 212, 213, 226, 226, 205, 145, 151, 226, 148, 232, 208, 224, 235, 179, 190, 212, 208, 187, 157, 123, 44, 20, 36, 97, 140, 54, 220, 164, 157], "n1": [3, 6, 7, 5, 14, 12, 10, 7, 11, 9, 7, 15, 6, 5, 10, 8, 9, 11, 11, 8, 8, 7, 0, 0, 2, 7, 9, 4, 11, 9, 8], "n2": [0, 2, 2, 1, 5, 2, 1, 0, 2, 0, 0, 2, 0, 1, 3, 2, 2, 5, 1, 3, 3, 1, 0, 0, 2, 1, 5, 1, 3, 3, 4], "n3": [0, 1, 0, 1, 2, 1, 0, 0, 1, 0, 0, 2, 0, 0, 1, 1, 0, 2, 0, 2, 1, 0, 0, 0, 0, 1, 1, 0, 1, 1, 3]}, "B": {"qty": [221, 200, 224, 219, 228, 230, 213, 152, 151, 217, 147, 239, 208, 227, 172, 182, 215, 219, 208, 188, 141, 113, 97, 21, 35, 96, 146, 57, 235, 168, 155], "n1": [21, 34, 40, 27, 32, 33, 23, 28, 22, 28, 18, 32, 41, 38, 19, 30, 32, 22, 28, 39, 15, 15, 15, 1, 4, 8, 22, 11, 25, 15, 14], "n2": [2, 12, 9, 1, 8, 11, 8, 6, 7, 7, 4, 4, 9, 10, 7, 7, 6, 7, 4, 9, 3, 4, 1, 0, 0, 0, 4, 2, 4, 5, 2], "n3": [2, 5, 4, 1, 2, 3, 0, 3, 1, 3, 3, 2, 2, 3, 2, 4, 1, 5, 3, 3, 1, 1, 0, 0, 0, 0, 0, 2, 0, 1, 1]}};
const L = {"lang": "en", "font": "\"Segoe UI\",system-ui,-apple-system,sans-serif", "title": "PDIV Reject Rate Trend", "sub": "{d0} – {d1} · {n} production days · Reject rate = NOK of that PDIV pass ÷ output of the same day", "tiles": ["Station A total reject rate", "Station B total reject rate", "Station A PDIV #1 reject rate", "Station B PDIV #1 reject rate", "Difference (B − A)"], "tile_note_qty": "Output {q} units · NOK {n}", "tile_note_nok": "NOK {n}", "tile_note_ratio": "Station B is about {x}× Station A", "sa": "Station A", "sb": "Station B", "cards": [["Station A — PDIV #1 Reject Rate", "Single series: day-to-day swing of the first inspection pass at Station A."], ["Station B — PDIV #1 Reject Rate", "Station B on the same basis."], ["Station A — PDIV #1 / #2 / #3 Reject Rate", "All three passes at one station; dark to light shades follow pass #1 / #2 / #3."], ["Station B — PDIV #1 / #2 / #3 Reject Rate", "Same view for Station B."], ["Station A vs Station B — PDIV #1 Reject Rate", "Head-to-head on the first pass, where most of the gap comes from."], ["Station A vs Station B — Total Reject Rate", "PDIV passes #1 + #2 + #3 combined."], ["Station A vs Station B — Daily Output", "Output tracks closely at both stations, so the reject-rate gap is not a volume effect."]], "s_a_p1": "Station A PDIV #1", "s_b_p1": "Station B PDIV #1", "s_p": ["PDIV #1", "PDIV #2", "PDIV #3"], "axis_x": "Date (MM.DD)", "table_toggle": "Show detail table (Station A / Station B, day by day)", "table_heads": ["Date", "A output", "A P1", "A P1 rate", "A P2", "A P2 rate", "A P3", "A P3 rate", "A total rate", "B output", "B P1", "B P1 rate", "B P2", "B P2 rate", "B P3", "B P3 rate", "B total rate"], "foot": "Generated by pdiv_nok_html_report_v1.2.0.py — a single offline file; double-click to open it in a browser."};
const pct = v => (v*100).toFixed(2) + '%';
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function rate(st, k, i){ return st.qty[i] ? st['n'+k][i] / st.qty[i] : 0; }
function totalRate(st, i){ return st.qty[i] ? (st.n1[i]+st.n2[i]+st.n3[i]) / st.qty[i] : 0; }

/* ---------- 折线图 ---------- */
function chart(host, cfg){
  const W=1080, H=330, M={t:16,r:112,b:52,l:64};
  const pw=W-M.l-M.r, ph=H-M.t-M.b;
  const cats=DATA.dates, n=cats.length;
  const all=cfg.series.flatMap(s=>s.values);
  const min=Math.min(0,...all);
  // 轴上界取整到 1/2/2.5/5 的整数倍，刻度读数才是整齐的 2% / 4% / 6%
  const nice=v=>{ if(v<=0) return 1;
    const e=Math.pow(10,Math.floor(Math.log10(v))), f=v/e;
    return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e; };
  const max=nice(Math.max(...all)*1.05);
  const x=i=> M.l + (n===1?pw/2:pw*i/(n-1));
  const y=v=> M.t + ph - ph*(v-min)/(max-min);
  const ticks=5, fmt=cfg.fmt;

  const NS='http://www.w3.org/2000/svg';
  const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':cfg.title});

  for(let i=0;i<=ticks;i++){
    const v=min+(max-min)*i/ticks, yy=y(v);
    svg.appendChild(el('line',{x1:M.l,x2:M.l+pw,y1:yy,y2:yy,stroke:cssv('--grid'),'stroke-width':1}));
    const t=el('text',{x:M.l-10,y:yy+4,'text-anchor':'end','font-size':11,fill:cssv('--text-muted')});
    t.textContent=fmt(v); svg.appendChild(t);
  }
  svg.appendChild(el('line',{x1:M.l,x2:M.l+pw,y1:M.t+ph,y2:M.t+ph,stroke:cssv('--axis'),'stroke-width':1}));

  const step=Math.ceil(n/12);
  cats.forEach((c,i)=>{ if(i%step) return;
    const t=el('text',{x:x(i),y:M.t+ph+20,'text-anchor':'end','font-size':10.5,
                       fill:cssv('--text-muted'),transform:`rotate(-40 ${x(i)} ${M.t+ph+20})`});
    t.textContent=c.slice(5); svg.appendChild(t);
  });
  const xl=el('text',{x:M.l+pw/2,y:H-4,'text-anchor':'middle','font-size':11,fill:cssv('--text-muted')});
  xl.textContent=L.axis_x; svg.appendChild(xl);

  const crosshair=el('line',{y1:M.t,y2:M.t+ph,stroke:cssv('--axis'),'stroke-width':1,opacity:0});
  svg.appendChild(crosshair);

  const endLabels=[];
  cfg.series.forEach(s=>{
    const color=cssv(s.color);
    const d=s.values.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
    svg.appendChild(el('path',{d,fill:'none',stroke:color,'stroke-width':2,
                               'stroke-linejoin':'round','stroke-linecap':'round'}));
    s.values.forEach((v,i)=>{
      svg.appendChild(el('circle',{cx:x(i),cy:y(v),r:3.4,fill:color,
                                   stroke:cssv('--surface-1'),'stroke-width':1.6}));
    });
    // 末端直接标注，识别不只靠颜色；位置先记下，稍后统一避让
    const lbl=el('text',{x:M.l+pw+8,'font-size':11.5,fill:cssv('--text-secondary')});
    lbl.textContent=s.name; svg.appendChild(lbl);
    endLabels.push({node:lbl, y:y(s.values[n-1])+4});
  });

  // 末端标签互相压住时按 14px 间距上下推开
  endLabels.sort((p,q)=>p.y-q.y);
  for(let i=1;i<endLabels.length;i++){
    if(endLabels[i].y-endLabels[i-1].y<14) endLabels[i].y=endLabels[i-1].y+14;
  }
  endLabels.forEach(l=>l.node.setAttribute('y',l.y));

  const hit=el('rect',{x:M.l,y:M.t,width:pw,height:ph,fill:'transparent'});
  svg.appendChild(hit);

  const tip=document.createElement('div'); tip.className='tip'; host.appendChild(tip);
  hit.addEventListener('mousemove',ev=>{
    const box=svg.getBoundingClientRect();
    const px=(ev.clientX-box.left)/box.width*W;
    const i=Math.max(0,Math.min(n-1,Math.round((px-M.l)/(pw/(n-1)))));
    crosshair.setAttribute('x1',x(i)); crosshair.setAttribute('x2',x(i));
    crosshair.setAttribute('opacity',1);
    tip.innerHTML='<b>'+cats[i]+'</b>'+cfg.series.map(s=>
      `<div class="row"><span class="dot" style="background:${cssv(s.color)}"></span>`+
      `<i>${s.name}</i>&nbsp;<span>${fmt(s.values[i])}</span></div>`).join('');
    tip.style.opacity=1;
    const hb=host.getBoundingClientRect();
    let left=ev.clientX-hb.left+14;
    if(left+tip.offsetWidth>hb.width-8) left=ev.clientX-hb.left-tip.offsetWidth-14;
    tip.style.left=left+'px';
    tip.style.top=(ev.clientY-hb.top-tip.offsetHeight-10)+'px';
  });
  hit.addEventListener('mouseleave',()=>{tip.style.opacity=0;crosshair.setAttribute('opacity',0);});

  host.appendChild(svg);
}

function card(i, series, fmt){
  const [title,cap]=L.cards[i];
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<h2>${title}</h2><p class="cap">${cap}</p>`;
  if(series.length>1){
    c.innerHTML+='<div class="legend">'+series.map(s=>
      `<span><i class="swatch" style="background:var(${s.color})"></i>${s.name}</span>`).join('')+'</div>';
  }
  document.getElementById('charts').appendChild(c);
  chart(c,{title,series,fmt});
}

/* ---------- 渲染 ---------- */
const A=DATA.A, B=DATA.B, N=DATA.dates.length;
const idx=[...Array(N).keys()];
const sum=a=>a.reduce((x,y)=>x+y,0);
const stat=st=>{
  const q=sum(st.qty), nk=[sum(st.n1),sum(st.n2),sum(st.n3)];
  return {qty:q, noks:nk, tot:nk[0]+nk[1]+nk[2], rate:(nk[0]+nk[1]+nk[2])/q, r1:nk[0]/q};
};
const SA=stat(A), SB=stat(B);
const f=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);

document.title = L.title;
document.getElementById('h1').textContent = L.title;
document.getElementById('sub').textContent = f(L.sub,{d0:DATA.dates[0],d1:DATA.dates[N-1],n:N});
document.getElementById('tglr').textContent = L.table_toggle;

document.getElementById('tiles').innerHTML = [
  [L.tiles[0], pct(SA.rate), f(L.tile_note_qty,{q:SA.qty,n:SA.tot})],
  [L.tiles[1], pct(SB.rate), f(L.tile_note_qty,{q:SB.qty,n:SB.tot})],
  [L.tiles[2], pct(SA.r1),  f(L.tile_note_nok,{n:SA.noks[0]})],
  [L.tiles[3], pct(SB.r1),  f(L.tile_note_nok,{n:SB.noks[0]})],
  [L.tiles[4], '+'+((SB.rate-SA.rate)*100).toFixed(2)+' pp',
               f(L.tile_note_ratio,{x:(SB.rate/SA.rate).toFixed(1)})],
].map(([k,v,n])=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n}</div></div>`).join('');

card(0,[{name:L.s_a_p1,color:'--sa',values:idx.map(i=>rate(A,1,i))}],pct);
card(1,[{name:L.s_b_p1,color:'--sb',values:idx.map(i=>rate(B,1,i))}],pct);
card(2,[{name:L.s_p[0],color:'--a1',values:idx.map(i=>rate(A,1,i))},
        {name:L.s_p[1],color:'--a2',values:idx.map(i=>rate(A,2,i))},
        {name:L.s_p[2],color:'--a3',values:idx.map(i=>rate(A,3,i))}],pct);
card(3,[{name:L.s_p[0],color:'--b1',values:idx.map(i=>rate(B,1,i))},
        {name:L.s_p[1],color:'--b2',values:idx.map(i=>rate(B,2,i))},
        {name:L.s_p[2],color:'--b3',values:idx.map(i=>rate(B,3,i))}],pct);
card(4,[{name:L.sa,color:'--sa',values:idx.map(i=>rate(A,1,i))},
        {name:L.sb,color:'--sb',values:idx.map(i=>rate(B,1,i))}],pct);
card(5,[{name:L.sa,color:'--sa',values:idx.map(i=>totalRate(A,i))},
        {name:L.sb,color:'--sb',values:idx.map(i=>totalRate(B,i))}],pct);
card(6,[{name:L.sa,color:'--sa',values:A.qty},
        {name:L.sb,color:'--sb',values:B.qty}],v=>Math.round(v));

document.getElementById('tbl').innerHTML =
  '<thead><tr>'+L.table_heads.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>'+
  idx.map(i=>'<tr>'+[DATA.dates[i],
    A.qty[i],A.n1[i],pct(rate(A,1,i)),A.n2[i],pct(rate(A,2,i)),A.n3[i],pct(rate(A,3,i)),pct(totalRate(A,i)),
    B.qty[i],B.n1[i],pct(rate(B,1,i)),B.n2[i],pct(rate(B,2,i)),B.n3[i],pct(rate(B,3,i)),pct(totalRate(B,i))
  ].map(v=>`<td>${v}</td>`).join('')+'</tr>').join('')+'</tbody>';

document.getElementById('foot').textContent = L.foot;
</script>
</body>
</html>
